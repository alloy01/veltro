services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      NODE_ENV: development
      JWT_SECRET: secret%20Key
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

  mongo: 
    image: mongo
    ports:
      - "27017:27017"

  client: 
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000/api